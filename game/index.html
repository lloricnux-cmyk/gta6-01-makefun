<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Bay — an original top-down open-world crime game. Drive and walk through a city, take on six missions for Mara Solano, drive taxi fares, race rivals, find hidden packages, ride bikes and trucks, and stay ahead of the Solmar Bay police. No downloads, no network: it runs entirely from these files.">
<title>Solmar Bay — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #f5f2ea; font: 18px system-ui, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Solmar Bay: drive and walk through an open-world city, take on six missions for Mara Solano, drive taxi fares, race rivals, find hidden packages, and stay ahead of the Solmar Bay police. WASD to move and drive, E to enter a car, H to honk, mouse to aim and click to shoot, Space to punch, Shift to run, Tab for the phone, 1 2 3 to switch guns, P to pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Solmar Bay needs JavaScript to play. Enable it and reload the page.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
